<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORMATING TAGS</title>
</head>
<body>
    <center>
<h1>FORMATING TAGS IN HTML </h1>
    <p>The  <b>HTML</b> is a Webpage</p>

    <p>The <i>HTML</i> is a Webpage</p>

    <p>The <u>HTML</u> is a Webpage</p>

    <p>The <mark>HTML</mark> is a Webpage</p>

    <p>The <strong>HTML</strong> is a Webpage</p>

    <p> The <em>HTML</em> is a Webpage</p>
    </center>
</body>
</html>

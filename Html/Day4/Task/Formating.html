<!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Formating</title>
        </head>
        <body>
            <center>
            <h1> THE FORMATING TAGS IN HTML</h1>
            </center>
            <ul>
            <li>1<sup>st</sup> TAG is <b>BOLD THE TEXT</b></li> <br>
            <li>2<sup>nd</sup> TAG is <i> ITALIC THE TEXT </i></li> <br>
            <li>3<sub>rd</sub> TAG is <mark> HIGHLIGHT THE TEXT</mark></li> <br>
            <li>4<sub>th</sub> TAG is <del> DELETED THE TEXT</del></li> <br>
            </ul>
            <strong>THESE ARE THE TYPES OF FORMATING TAGS IN HTML</strong>
        </body>
        </html>

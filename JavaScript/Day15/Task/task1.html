<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Hide</title>

    <style>
        #para {
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: 0.5s;
}

#para.show {
    opacity: 1;
    max-height: 100px;
}
    </style>
</head>

<body>

    <p id="para">
    This is my paragraph. I can be shown and hidden
    </p>

    <button id="btn">Show</button>

    <script src="assets/js/task1.js"></script>

</body>
</html>

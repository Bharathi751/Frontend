<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Colored Boxes</title>
    <style>
        .box {
            width: 350px;
            height: 120px;
            text-align: center;
            color: white;
            margin: 10px auto;
        }
    </style>
</head>
<body>
    <div class="box" style="background-color: red;">
        <h2>Red Box</h2>
        <p>This is the first colored box.</p>
    </div>
    <div class="box" style="background-color: blue;">
        <h2>Blue Box</h2>
        <p>This is the second colored box.</p>
    </div>
    <div class="box" style="background-color: green;">
        <h2>Green Box</h2>
        <p>This is the third colored box.</p>
    </div>
    <div class="box" style="background-color: orange;">
        <h2>Orange Box</h2>
        <p>This is the fourth colored box.</p>
    </div>
    <div class="box" style="background-color: purple;">
        <h2>Purple Box</h2>
        <p>This is the fifth colored box.</p>
    </div>
</body>
</html>

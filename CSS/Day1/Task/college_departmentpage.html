<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Departments</title>
    <style>
        body {
            text-align: center;
            background-color: #d61717;
        }
        .dept {
            width: 300px;
            height: 60px;
            color: white;
            text-align: center;
            margin: 15px auto;
        }
        .cse {
            background-color: rgb(157, 255, 0);
        }
        .it {
            background-color: rgb(100, 9, 247);
        }
        .ece {
            background-color: orange;
        }
        .eee {
            background-color: rgb(219, 12, 219);
        }
        .mech {
            background-color: rgb(37, 171, 248);
        }
    </style>
</head>
<body>
    <h1>Engineering Departments</h1>
    <div class="dept cse">CSE</div>
    <div class="dept it">IT</div>
    <div class="dept ece">ECE</div>
    <div class="dept eee">EEE</div>
    <div class="dept mech">Mechanical</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hide Cards Example</title>
    <link rel="stylesheet" href="assets/css/style5.css">
</head>
<body>
    <h2>display: none</h2>
    <div class="container">
        <div class="card">Card 1</div>
        <div class="card display-none">Card 2</div>
        <div class="card">Card 3</div>
    </div>
    <hr>
    <h2>visibility: hidden</h2>
    <div class="container">
        <div class="card">Card 1</div>
        <div class="card visibility-hidden">Card 2</div>
        <div class="card">Card 3</div>
    </div>
</body>
</html>

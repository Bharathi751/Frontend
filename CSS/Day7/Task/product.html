<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <link rel="stylesheet" href="assets/css/style3.css">
</head>
<body>
    <h1>Product Grid</h1>
    <div class="product-grid">
        <div class="card">
            <img src="images/11.jpg" alt="Product 1">
            <h3>Phone</h3>
            <p>₹99,999</p>
        </div>
        <div class="card">
            <img src="images/12.webp" alt="Product 2">
            <h3>Headphone</h3>
            <p>₹8,999</p>
        </div>
        <div class="card">
            <img src="images/13.jpg" alt="Product 3">
            <h3>Laptop</h3>
            <p>₹79,999</p>
        </div>
        <div class="card">
            <img src="images/14.webp" alt="Product 4">
            <h3>Watch</h3>
            <p>₹7,999</p>
        </div>
        <div class="card">
            <img src="images/15.webp" alt="Product 5">
            <h3>I pad</h3>
            <p>₹55,499</p>
        </div>
        <div class="card">
            <img src="images/16.jpg" alt="Product 6">
            <h3>Airpods</h3>
            <p>₹29,999</p>
        </div>
        <div class="card">
            <img src="images/17.webp" alt="Product 7">
            <h3>Speaker</h3>
            <p>₹9,999</p>
        </div>
        <div class="card">
            <img src="images/18.jpg" alt="Product 8">
            <h3>Powerbank</h3>
            <p>₹1,999</p>
        </div>
    </div>
</body>
</html>

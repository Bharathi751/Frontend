<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="iotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="85" fill="#070d1e" stroke="url(#iotGrad)" stroke-width="2" />
  
  <!-- Radar Wave Rings -->
  <circle cx="100" cy="100" r="60" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5" />
  <circle cx="100" cy="100" r="35" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7" />
  
  <!-- Central Transmission Tower -->
  <polygon points="100,50 92,130 108,130" fill="#0e2a47" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="90" y1="130" x2="110" y2="130" stroke="#22d3ee" stroke-width="2" />
  <line x1="85" y1="145" x2="115" y2="145" stroke="#22d3ee" stroke-width="2" />
  <line x1="92" y1="130" x2="85" y2="145" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="108" y1="130" x2="115" y2="145" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Radio Waves Top -->
  <path d="M90 40 Q100 30 110 40" stroke="#00f2fe" stroke-width="2" fill="none" />
  <path d="M82 32 Q100 18 118 32" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6" />

  <!-- Connected Sensor Nodes -->
  <circle cx="50" cy="80" r="5" fill="#22d3ee" />
  <circle cx="150" cy="80" r="5" fill="#22d3ee" />
  <circle cx="60" cy="130" r="4.5" fill="#38bdf8" />
  <circle cx="140" cy="130" r="4.5" fill="#38bdf8" />

  <!-- Connecting Lines -->
  <line x1="100" y1="50" x2="50" y2="80" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="100" y1="50" x2="150" y2="80" stroke="#22d3ee" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="100" y1="100" x2="60" y2="130" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
  <line x1="100" y1="100" x2="140" y2="130" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" />
</svg>
